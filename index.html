<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b0e"><meta name="description" content="Campanhas e fichas de Ordem Paranormal RPG 1.2, sem login e com painel do mestre.">
<title>Arquivo da Ordem | Campanhas e Fichas</title>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/character.css"><link rel="stylesheet" href="ordem/style.css">
</head>
<body class="op-body">
<div id="app" class="op-shell">
<header class="op-topbar"><div class="op-brand"><div class="op-symbol" aria-hidden="true">◈</div><div><div class="op-eyebrow">CENTRAL DE INVESTIGAÇÕES</div><h1>Arquivo da Ordem <span>RPG</span></h1></div></div><button id="op-mobile-tools" class="op-btn op-mobile-tools" data-action="toggle-tools" aria-expanded="false" aria-controls="op-topactions" aria-label="Opções de importação e exportação" hidden>⋯ <span>Opções</span></button><div class="op-topactions" id="op-topactions" hidden><span class="op-storage"><span class="op-dot"></span><span id="op-storage-label">Modo local</span></span><button class="op-btn op-btn-subtle" data-action="export">Exportar JSON</button><label class="op-btn op-btn-subtle op-file">Importar fichas<input id="import-file" type="file" accept=".json,application/json" hidden></label></div></header>
<section id="op-landing" class="op-landing" aria-label="Campanhas"></section>
<div id="op-campaign-bar" class="op-campaign-bar" hidden><button class="op-btn op-btn-subtle" data-action="home">← Campanhas</button><div class="op-campaign-title"><small>CAMPANHA ATUAL</small><strong id="op-campaign-title"></strong></div><nav class="op-view-tabs" aria-label="Áreas da campanha"><button class="op-btn active" id="op-sheets-btn" data-action="sheets" aria-pressed="true">Fichas</button><button class="op-btn" id="op-master-btn" data-action="master" aria-pressed="false">Painel do mestre</button></nav></div>
<div id="op-workspace" class="op-workspace" hidden><aside class="op-sidebar"><div class="op-sidehead"><small>PERSONAGENS</small><button class="op-btn op-btn-primary op-add" data-action="new">+ Nova ficha</button></div><div id="character-list" class="op-agent-list"></div><div class="op-sidefooter"><div class="op-side-divider"></div><strong>ACESSO LIVRE</strong><p>Sem conta. Qualquer participante pode abrir e editar todas as fichas desta campanha. Faça backups regularmente.</p></div></aside><div class="op-maincolumn"><div id="op-hero"></div><nav class="op-tabs" id="op-tabs" aria-label="Seções da ficha"></nav><main id="op-content" class="op-content" tabindex="-1"></main></div></div>
<footer class="op-footer"><span id="op-save-status" role="status">Carregando dados…</span><span>Ordem Paranormal RPG · Regras v1.2</span></footer>
</div>
<div id="op-toast" role="status" aria-live="polite"></div>
<script src="ordem-config.js" onerror="/* Configuração opcional de sincronização */"></script>
<script type="module" src="ordem/main.mjs"></script>
</body>
</html>
